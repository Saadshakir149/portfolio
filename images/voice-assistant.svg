    <rect x="355" y="355" width="8" height="70" rx="4"/>
    <rect x="373" y="347" width="8" height="86" rx="4"/>
    <rect x="391" y="342" width="8" height="96" rx="4"/>
    <rect x="409" y="347" width="8" height="86" rx="4"/>
    <rect x="427" y="355" width="8" height="70" rx="4"/>
