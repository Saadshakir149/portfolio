<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12081d"/><stop offset="1" stop-color="#2a0f35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c026d3" stop-opacity=".5"/><stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#f5d0fe"/><stop offset=".45" stop-color="#c026d3"/><stop offset="1" stop-color="#581c87"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="670" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity=".2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="210" r="230" fill="url(#glow)"/>

  <!-- mic -->
  <circle cx="400" cy="200" r="165" fill="none" stroke="#fff" stroke-opacity=".05"/>
  <circle cx="400" cy="200" r="130" fill="none" stroke="#fff" stroke-opacity=".09" stroke-dasharray="2 7"/>
  <circle cx="400" cy="200" r="95" fill="none" stroke="#f0abfc" stroke-opacity=".25"/>
  <circle cx="400" cy="200" r="62" fill="url(#orb)"/>
  <rect x="386" y="166" width="28" height="46" rx="14" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M372 202 a28 28 0 0 0 56 0"/>
    <path d="M400 230 V242 M388 242 H412"/>
  </g>

  <!-- waveform -->
  <g fill="url(#wave)">
    <rect x="121" y="386" width="8" height="8" rx="4"/>
    <rect x="139" y="384" width="8" height="12" rx="4"/>
    <rect x="157" y="381" width="8" height="18" rx="4"/>
