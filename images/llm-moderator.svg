<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1d"/><stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#312e81"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="250" r="230" fill="url(#glow)"/>

  <!-- connections -->
  <g fill="none" stroke="#a5b4fc" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round">
    <path d="M190 160 Q300 170 345 212"/>
    <path d="M610 160 Q500 170 455 212"/>
    <path d="M400 398 V325"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="268" cy="172" r="4"/><circle cx="532" cy="172" r="4"/><circle cx="400" cy="362" r="4"/>
  </g>

  <!-- AI orb -->
  <circle cx="400" cy="250" r="145" fill="none" stroke="#fff" stroke-opacity=".07" stroke-dasharray="2 7"/>
  <circle cx="400" cy="250" r="106" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="400" cy="250" r="72" fill="url(#orb)"/>
  <path d="M400 214 C404 238 412 246 436 250 C412 254 404 262 400 286 C396 262 388 254 364 250 C388 246 396 238 400 214Z" fill="#fff"/>
  <path d="M430 210 C431 217 433 219 440 220 C433 221 431 223 430 230 C429 223 427 221 420 220 C427 219 429 217 430 210Z" fill="#fff" fill-opacity=".85"/>

  <!-- participants -->
  <g transform="translate(160 150)">
    <circle r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cy="-8" r="9" fill="#c7d2fe"/><path d="M-15 18 Q-15 3 0 3 Q15 3 15 18Z" fill="#c7d2fe"/>
  </g>
  <g transform="translate(640 150)">
    <circle r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cy="-8" r="9" fill="#c7d2fe"/><path d="M-15 18 Q-15 3 0 3 Q15 3 15 18Z" fill="#c7d2fe"/>
  </g>
  <g transform="translate(400 430)">
    <circle r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cy="-8" r="9" fill="#c7d2fe"/><path d="M-15 18 Q-15 3 0 3 Q15 3 15 18Z" fill="#c7d2fe"/>
  </g>

  <!-- chat bubbles -->
  <rect x="200" y="56" width="170" height="48" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/>
  <rect x="216" y="72" width="112" height="6" rx="3" fill="#fff" fill-opacity=".55"/>
  <rect x="216" y="86" width="72" height="6" rx="3" fill="#fff" fill-opacity=".3"/>

  <rect x="440" y="56" width="160" height="48" rx="14" fill="#6366f1" fill-opacity=".35" stroke="#a5b4fc" stroke-opacity=".5"/>
  <rect x="456" y="72" width="120" height="6" rx="3" fill="#e0e7ff" fill-opacity=".8"/>
  <rect x="456" y="86" width="84" height="6" rx="3" fill="#e0e7ff" fill-opacity=".5"/>

  <rect x="448" y="404" width="140" height="44" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/>
  <rect x="464" y="419" width="96" height="6" rx="3" fill="#fff" fill-opacity=".55"/>
  <rect x="464" y="432" width="60" height="6" rx="3" fill="#fff" fill-opacity=".3"/>

  <!-- chips -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <rect x="138" y="232" width="150" height="32" rx="16" fill="#0b2a1a" stroke="#22c55e" stroke-opacity=".5"/>
    <circle cx="158" cy="248" r="4" fill="#4ade80"/>
    <text x="170" y="252" fill="#86efac">ACTIVE MODE</text>
    <rect x="522" y="232" width="140" height="32" rx="16" fill="#1e1b4b" stroke="#a5b4fc" stroke-opacity=".4"/>
    <text x="592" y="252" fill="#c7d2fe" text-anchor="middle">GPT-4o-mini</text>
  </g>
</svg>
